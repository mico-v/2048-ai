<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048 AI - Liquid Glass Edition</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", sans-serif; }
        
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(-45deg, #667eea, #764ba2, #f093fb, #f5576c);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            overflow: hidden;
        }
        
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        .container {
            text-align: center;
            z-index: 5;
            width: 100%;
            max-width: 700px;
            padding: 20px;
            margin: auto;
        }
        
        h1 {
            font-size: 72px;
            font-weight: 700;
            background: linear-gradient(135deg, #fff, rgba(255,255,255,.8));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,.2));
            margin-bottom: 20px;
            letter-spacing: -2px;
        }
        
        .scoreboard {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        
        .score-box {
            background: rgba(255,255,255,.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,.25);
            border-radius: 16px;
            padding: 12px 28px;
            color: #fff;
            box-shadow: 0 8px 32px rgba(31,38,135,.2);
            min-width: 100px;
        }
        
        .score-box .label {
            font-size: 12px;
            opacity: .7;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .score-box .value {
            font-size: 28px;
            font-weight: 700;
        }
        
        .status-bar {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 20px;
            color: rgba(255,255,255,.8);
            font-size: 14px;
        }
        
        .board {
            position: relative;
            background: rgba(255,255,255,.1);
            backdrop-filter: blur(45px) saturate(180%);
            -webkit-backdrop-filter: blur(45px) saturate(180%);
            border: 1px solid rgba(255,255,255,.3);
            border-radius: 24px;
            padding: 14px;
            display: inline-block;
            box-shadow: 
                0 25px 80px rgba(0,0,0,.3),
                0 4px 6px rgba(255,255,255,.4) inset,
                0 -2px 6px rgba(0,0,0,.1) inset;
        }
        
        .board::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: linear-gradient(135deg, rgba(255,255,255,.4) 0%, rgba(255,255,255,0) 50%);
            pointer-events: none;
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 100px);
            grid-template-rows: repeat(4, 100px);
            gap: 12px;
            position: relative;
        }
        
        .cell {
            background: rgba(255,255,255,.08);
            border: 1px solid rgba(255,255,255,.1);
            border-radius: 16px;
        }
        
        .tile {
            position: absolute;
            width: 100px;
            height: 100px;
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 36px;
            font-weight: 700;
            transition: .15s cubic-bezier(.25,.1,.25,1);
            box-shadow: 0 4px 20px rgba(0,0,0,.15);
            color: #333;
            transform: scale(1);
        }
        
        .tile.new { animation: popIn .2s cubic-bezier(.25,.1,.25,1); }
        .tile.merged { animation: merge .2s cubic-bezier(.25,.1,.25,1); }
        
        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        
        @keyframes merge {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }
        
        .tile-2 { background: linear-gradient(135deg, #FFD1DC, #FFB6C1); }
        .tile-4 { background: linear-gradient(135deg, #FFF5BA, #FFE4B5); }
        .tile-8 { background: linear-gradient(135deg, #D5F3F4, #B0E0E6); }
        .tile-16 { background: linear-gradient(135deg, #E8D1FF, #DDA0DD); }
        .tile-32 { background: linear-gradient(135deg, #FFDAC1, #FFDAB9); }
        .tile-64 { background: linear-gradient(135deg, #C8E7F9, #87CEEB); }
        .tile-128 { background: linear-gradient(135deg, #D9B5FF, #DA70D6); font-size: 28px; }
        .tile-256 { background: linear-gradient(135deg, #B0E0E6, #98D8C8); font-size: 28px; }
        .tile-512 { background: linear-gradient(135deg, #FFB7B2, #FF9AA2); font-size: 28px; }
        .tile-1024 { background: linear-gradient(135deg, #C8FACC, #98FB98); font-size: 24px; }
        .tile-2048 { background: linear-gradient(135deg, #FFE5B4, #FFD700); font-size: 24px; animation: glow 2s ease-in-out infinite; }
        .tile-4096 { background: linear-gradient(135deg, #FF6B6B, #EE5A5A); font-size: 24px; color: #fff; }
        .tile-8192 { background: linear-gradient(135deg, #667eea, #764ba2); font-size: 24px; color: #fff; animation: glow 2s ease-in-out infinite; }
        .tile-16384 { background: linear-gradient(135deg, #f093fb, #f5576c); font-size: 20px; color: #fff; animation: glow 2s ease-in-out infinite; }
        .tile-32768 { background: linear-gradient(135deg, #11998e, #38ef7d); font-size: 20px; color: #fff; animation: glow 2s ease-in-out infinite; }
        
        @keyframes glow {
            0%, 100% { box-shadow: 0 0 20px rgba(255,215,0,.5), 0 4px 20px rgba(0,0,0,.15); }
            50% { box-shadow: 0 0 40px rgba(255,215,0,.8), 0 4px 20px rgba(0,0,0,.15); }
        }
        
        .controls {
            margin-top: 24px;
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        button {
            padding: 14px 32px;
            border: none;
            border-radius: 999px;
            background: rgba(255,255,255,.15);
            color: #fff;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,.25);
            transition: all .25s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        button:hover {
            background: rgba(255,255,255,.25);
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0,0,0,.2);
        }
        
        button:active { transform: translateY(-1px); }
        
        button:disabled {
            opacity: .5;
            cursor: not-allowed;
            transform: none;
        }
        
        button.active {
            background: linear-gradient(135deg, #f5576c, #f093fb);
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(245,87,108,.4); }
            50% { box-shadow: 0 0 0 15px rgba(245,87,108,0); }
        }
        
        .speed-control {
            margin-top: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            color: rgba(255,255,255,.8);
            font-size: 14px;
        }
        
        .speed-control input[type="range"] {
            width: 150px;
            height: 6px;
            border-radius: 3px;
            appearance: none;
            background: rgba(255,255,255,.3);
            outline: none;
        }
        
        .speed-control input[type="range"]::-webkit-slider-thumb {
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,.3);
            cursor: pointer;
            transition: transform .2s;
        }
        
        .speed-control input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.1);
        }
        
        .overlay {
            position: fixed;
            inset: 0;
            display: none;
            justify-content: center;
            align-items: center;
            background: rgba(0,0,0,.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 100;
        }
        
        .overlay.show { display: flex; }
        
        .modal {
            background: rgba(255,255,255,.15);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            padding: 50px 60px;
            border-radius: 28px;
            border: 1px solid rgba(255,255,255,.25);
            color: #fff;
            text-align: center;
            box-shadow: 0 25px 80px rgba(0,0,0,.3);
        }
        
        .modal h2 {
            font-size: 48px;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #fff, rgba(255,255,255,.8));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .modal p {
            font-size: 18px;
            opacity: .8;
            margin-bottom: 30px;
        }
        
        .loading-overlay {
            position: fixed;
            inset: 0;
            background: linear-gradient(-45deg, #667eea, #764ba2, #f093fb, #f5576c);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            color: #fff;
        }
        
        .loading-overlay.hidden { display: none; }
        
        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255,255,255,.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 25px;
        }
        
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .loading-text {
            font-size: 20px;
            font-weight: 500;
            letter-spacing: 1px;
        }
        
        .instructions {
            margin-top: 25px;
            color: rgba(255,255,255,.6);
            font-size: 13px;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
            line-height: 1.6;
        }
        
        .key {
            display: inline-block;
            background: rgba(255,255,255,.2);
            padding: 3px 10px;
            border-radius: 6px;
            font-family: monospace;
            font-weight: bold;
            margin: 0 2px;
        }
        
        @media (max-width: 500px) {
            h1 { font-size: 48px; }
            .grid {
                grid-template-columns: repeat(4, 70px);
                grid-template-rows: repeat(4, 70px);
                gap: 8px;
            }
            .cell, .tile { width: 70px; height: 70px; border-radius: 12px; }
            .tile { font-size: 24px; }
            .tile-128, .tile-256, .tile-512 { font-size: 20px; }
            .tile-1024, .tile-2048, .tile-4096, .tile-8192, .tile-16384, .tile-32768 { font-size: 16px; }
            button { padding: 12px 20px; font-size: 13px; }
            .score-box { padding: 10px 20px; }
            .score-box .value { font-size: 22px; }
        }
    </style>
</head>
<body>
    <div class="loading-overlay" id="loading">
        <div class="spinner"></div>
        <div class="loading-text">Loading AI Module...</div>
    </div>
    
    <div class="container">
        <h1>2048</h1>
        
        <div class="scoreboard">
            <div class="score-box">
                <div class="label">Score</div>
                <div class="value" id="score">0</div>
            </div>
            <div class="score-box">
                <div class="label">Best</div>
                <div class="value" id="best">0</div>
            </div>
        </div>
        
        <div class="status-bar">
            <span id="moves-count">Moves: 0</span>
            <span id="max-tile">Max: 0</span>
        </div>
        
        <div class="board" id="board">
            <div class="grid" id="grid"></div>
        </div>
        
        <div class="controls">
            <button id="new-btn">New Game</button>
            <button id="ai-btn">AI Move</button>
            <button id="auto-btn">Autoplay</button>
        </div>
        
        <div class="speed-control">
            <label>Speed:</label>
            <input type="range" id="speed-slider" min="50" max="500" value="150">
            <span id="speed-value">150ms</span>
        </div>
        
        <div class="instructions">
            Use <span class="key">↑</span> <span class="key">↓</span> <span class="key">←</span> <span class="key">→</span> 
            or <span class="key">W</span> <span class="key">A</span> <span class="key">S</span> <span class="key">D</span> to move tiles.
            Swipe on mobile devices.
        </div>
    </div>
    
    <div class="overlay" id="game-over-overlay">
        <div class="modal">
            <h2 id="overlay-title">Game Over</h2>
            <p id="overlay-message">Your score: <span id="final-score">0</span></p>
            <button id="retry-btn">Try Again</button>
        </div>
    </div>
    
    <script src="2048.js"></script>
    <script>
        // Game state
        let board = new Uint32Array(16);
        let score = 0;
        let best = parseInt(localStorage.getItem('2048-ai-best') || '0');
        let moves = 0;
        let isAutoplay = false;
        let autoplayInterval = null;
        let wasmModule = null;
        let gameOver = false;
        let tileElements = new Map();
        let tileIdCounter = 0;

        // WASM functions
        let initTables, executeMoveHi, executeMoveLo, findBestMove, getMaxTile, hasValidMoves;

        // Speed control
        let autoplaySpeed = 150;

        // Initialize
        async function init() {
            try {
                wasmModule = await Module2048();
                
                initTables = wasmModule.cwrap('init_tables', null, []);
                executeMoveLo = wasmModule.cwrap('execute_move_lo', 'number', ['number', 'number', 'number']);
                executeMoveHi = wasmModule.cwrap('execute_move_hi', 'number', ['number', 'number', 'number']);
                findBestMove = wasmModule.cwrap('find_best_move_split', 'number', ['number', 'number']);
                getMaxTile = wasmModule.cwrap('get_max_tile', 'number', ['number', 'number']);
                hasValidMoves = wasmModule.cwrap('has_valid_moves', 'number', ['number', 'number']);

                initTables();
                document.getElementById('loading').classList.add('hidden');

                // Build grid cells
                const grid = document.getElementById('grid');
                for (let i = 0; i < 16; i++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    grid.appendChild(cell);
                }

                // Event listeners
                document.addEventListener('keydown', handleKeydown);
                setupTouchControls();
                
                document.getElementById('new-btn').addEventListener('click', newGame);
                document.getElementById('ai-btn').addEventListener('click', aiMove);
                document.getElementById('auto-btn').addEventListener('click', toggleAutoplay);
                document.getElementById('retry-btn').addEventListener('click', () => {
                    document.getElementById('game-over-overlay').classList.remove('show');
                    newGame();
                });

                const speedSlider = document.getElementById('speed-slider');
                speedSlider.addEventListener('input', (e) => {
                    autoplaySpeed = parseInt(e.target.value);
                    document.getElementById('speed-value').textContent = autoplaySpeed + 'ms';
                    if (isAutoplay) {
                        clearInterval(autoplayInterval);
                        autoplayInterval = setInterval(doAutoplayMove, autoplaySpeed);
                    }
                });

                document.getElementById('best').textContent = best;
                newGame();
            } catch (error) {
                console.error('Failed to initialize WASM module:', error);
                document.getElementById('loading').innerHTML = '<div style="color: #ff6b6b; font-size: 18px;">Failed to load AI module. Please refresh.</div>';
            }
        }

        function setupTouchControls() {
            let startX, startY;
            const board = document.getElementById('board');
            
            board.addEventListener('touchstart', (e) => {
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
            }, { passive: true });
            
            board.addEventListener('touchend', (e) => {
                if (startX === null || startY === null || gameOver) return;
                
                const deltaX = e.changedTouches[0].clientX - startX;
                const deltaY = e.changedTouches[0].clientY - startY;
                const minSwipe = 30;
                
                if (Math.abs(deltaX) > Math.abs(deltaY) && Math.abs(deltaX) > minSwipe) {
                    move(deltaX > 0 ? 3 : 2); // right : left
                } else if (Math.abs(deltaY) > minSwipe) {
                    move(deltaY > 0 ? 1 : 0); // down : up
                }
                
                startX = startY = null;
            }, { passive: true });
        }

        function newGame() {
            board = new Uint32Array(16);
            score = 0;
            moves = 0;
            gameOver = false;
            
            if (isAutoplay) toggleAutoplay();
            
            clearAllTiles();
            addRandomTile();
            addRandomTile();
            updateDisplay();
            
            document.getElementById('game-over-overlay').classList.remove('show');
        }

        function clearAllTiles() {
            tileElements.forEach(tile => tile.el.remove());
            tileElements.clear();
        }

        function getCellPosition(index) {
            const cells = document.querySelectorAll('.cell');
            const cell = cells[index];
            return {
                left: cell.offsetLeft,
                top: cell.offsetTop
            };
        }

        function createTileElement(index, value, isNew = true) {
            const el = document.createElement('div');
            const displayValue = 1 << value;
            el.className = `tile tile-${displayValue}${isNew ? ' new' : ''}`;
            el.textContent = displayValue;
            
            const pos = getCellPosition(index);
            el.style.left = pos.left + 'px';
            el.style.top = pos.top + 'px';
            
            document.getElementById('board').appendChild(el);
            
            const id = ++tileIdCounter;
            tileElements.set(id, { el, index, value });
            
            if (isNew) {
                setTimeout(() => el.classList.remove('new'), 200);
            }
            
            return id;
        }

        function addRandomTile() {
            const emptyCells = [];
            for (let i = 0; i < 16; i++) {
                if (board[i] === 0) emptyCells.push(i);
            }
            
            if (emptyCells.length > 0) {
                const index = emptyCells[Math.floor(Math.random() * emptyCells.length)];
                const value = Math.random() < 0.9 ? 1 : 2;
                board[index] = value;
                createTileElement(index, value, true);
            }
        }

        function boardToWasm() {
            let lo = 0, hi = 0;
            for (let i = 0; i < 8; i++) lo |= (board[i] & 0xf) << (i * 4);
            for (let i = 0; i < 8; i++) hi |= (board[i + 8] & 0xf) << (i * 4);
            return { lo, hi };
        }

        function wasmToBoard(lo, hi) {
            const newBoard = new Uint32Array(16);
            for (let i = 0; i < 8; i++) newBoard[i] = (lo >> (i * 4)) & 0xf;
            for (let i = 0; i < 8; i++) newBoard[i + 8] = (hi >> (i * 4)) & 0xf;
            return newBoard;
        }

        function executeWasmMove(direction) {
            const { lo, hi } = boardToWasm();
            const newLo = executeMoveLo(direction, lo, hi);
            const newHi = executeMoveHi(direction, lo, hi);
            return wasmToBoard(newLo, newHi);
        }

        function move(direction) {
            if (gameOver) return false;

            const oldBoard = board.slice();
            const newBoard = executeWasmMove(direction);
            
            let changed = false;
            for (let i = 0; i < 16; i++) {
                if (newBoard[i] !== oldBoard[i]) {
                    changed = true;
                    break;
                }
            }

            if (changed) {
                let mergeScore = 0;
                const mergedIndices = [];
                
                for (let i = 0; i < 16; i++) {
                    if (newBoard[i] > oldBoard[i] && newBoard[i] > 0) {
                        mergeScore += (1 << newBoard[i]);
                        mergedIndices.push(i);
                    }
                }
                
                board = newBoard;
                score += mergeScore;
                moves++;
                
                if (score > best) {
                    best = score;
                    localStorage.setItem('2048-ai-best', best.toString());
                }

                renderTiles(mergedIndices);
                addRandomTile();
                updateDisplay();
                checkGameOver();
                return true;
            }
            return false;
        }

        function renderTiles(mergedIndices = []) {
            clearAllTiles();
            
            for (let i = 0; i < 16; i++) {
                if (board[i] > 0) {
                    const id = createTileElement(i, board[i], false);
                    if (mergedIndices.includes(i)) {
                        const tile = tileElements.get(id);
                        tile.el.classList.add('merged');
                        setTimeout(() => tile.el.classList.remove('merged'), 200);
                    }
                }
            }
        }

        function checkGameOver() {
            const { lo, hi } = boardToWasm();
            if (!hasValidMoves(lo, hi)) {
                gameOver = true;
                if (isAutoplay) toggleAutoplay();
                
                const maxTile = getMaxTile(lo, hi);
                const overlay = document.getElementById('game-over-overlay');
                const title = document.getElementById('overlay-title');
                const message = document.getElementById('overlay-message');
                
                if (maxTile >= 11) {
                    title.textContent = '🎉 You Win!';
                    message.innerHTML = `Amazing! You reached ${1 << maxTile}!<br>Score: <span id="final-score">${score}</span>`;
                } else {
                    title.textContent = 'Game Over';
                    message.innerHTML = `Your score: <span id="final-score">${score}</span>`;
                }
                
                overlay.classList.add('show');
            }
        }

        function updateDisplay() {
            document.getElementById('score').textContent = score;
            document.getElementById('best').textContent = best;
            document.getElementById('moves-count').textContent = `Moves: ${moves}`;
            
            const { lo, hi } = boardToWasm();
            const maxTileExp = getMaxTile(lo, hi);
            const maxTileValue = maxTileExp > 0 ? (1 << maxTileExp) : 0;
            document.getElementById('max-tile').textContent = `Max: ${maxTileValue}`;
        }

        function handleKeydown(e) {
            if (gameOver) return;
            
            const dirs = {
                'ArrowUp': 0, 'w': 0, 'W': 0,
                'ArrowDown': 1, 's': 1, 'S': 1,
                'ArrowLeft': 2, 'a': 2, 'A': 2,
                'ArrowRight': 3, 'd': 3, 'D': 3
            };
            
            if (dirs[e.key] !== undefined) {
                e.preventDefault();
                move(dirs[e.key]);
            }
        }

        async function aiMove() {
            if (gameOver || isAutoplay) return;
            
            const { lo, hi } = boardToWasm();
            const bestMove = findBestMove(lo, hi);
            
            if (bestMove >= 0) {
                move(bestMove);
            }
        }

        function doAutoplayMove() {
            if (gameOver) {
                toggleAutoplay();
                return;
            }
            
            const { lo, hi } = boardToWasm();
            const bestMove = findBestMove(lo, hi);
            
            if (bestMove >= 0) {
                move(bestMove);
            } else {
                toggleAutoplay();
            }
        }

        function toggleAutoplay() {
            isAutoplay = !isAutoplay;
            const btn = document.getElementById('auto-btn');
            const aiBtn = document.getElementById('ai-btn');
            
            if (isAutoplay) {
                btn.textContent = 'Stop';
                btn.classList.add('active');
                aiBtn.disabled = true;
                autoplayInterval = setInterval(doAutoplayMove, autoplaySpeed);
            } else {
                btn.textContent = 'Autoplay';
                btn.classList.remove('active');
                aiBtn.disabled = false;
                if (autoplayInterval) {
                    clearInterval(autoplayInterval);
                    autoplayInterval = null;
                }
            }
        }

        init();
    </script>
</body>
</html>
